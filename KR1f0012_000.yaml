front:
  text: 御纂孝經集注序
  hash: sha256:00d2795339f4b526099ff92a37b5c593b759f1d0a86a66af8ddf8906a2a7239b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1f0012_WYG_000-1a, image: WYG0182/WYG0182-0269a.png}
body:
  text: 孝經者聖人所以彰明彝訓覺悟生民溯天地之性則知人為萬物之靈叙家國之倫則知孝為百行之始人能孝於其親處稱惇實之士出成忠順之臣下以此為立身之要上以此為立教之原故謂之至德要道自昔聖帝哲王宰世經物未有不以孝治為先務者也恭惟聖祖仁皇帝纘述世祖章皇帝遺緒詔命儒臣編輯孝經衍義一百卷刋行海內垂示永久顧以篇帙繁多慮讀者未能周遍朕乃命專譯經文以便誦習夫孝經一書詞簡義暢可不煩注解而自明誠使內外臣庶父以教其子師以教其徒口諷其文心知其理身踐其事為士大夫者能資孝作忠揚名顯親為庶人者能謹身節用竭力致養家庭務敦於本行閭里胥嚮於淳風如此則親遜成化和氣薰蒸躋比户可封之俗是朕之所厚望也夫欽定四庫全書經部六御纂孝經集注孝經類提要臣等謹案孝經集注一卷世宗憲皇帝御纂雍正五年製序頒行我朝列聖相承宏敷孝理故於是經闡發尤備世祖章皇帝既為之注復有衍義之輯而聖祖仁皇帝纘成之本末條貫義無遺藴世宗憲皇帝慮其篇帙浩富或未能家喻户曉乃命約為此注專釋經文以便誦習而詞㫖顯暢俾讀者賢愚共曉其體例悉仿朱子四書章句集注為之洵萬古說經教孝之至極矣乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
